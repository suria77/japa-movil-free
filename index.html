<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Japa-Móvil Lite</title>
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Japa Lite">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>html,body{margin:0;padding:0;background:#000;}</style>
</head>
<body style="margin:0;padding:0;background:#000;">
<script>
window.DISC_PAGES = {
"taoTeChing":"discos/tao-te-ching.html",
"dhammapada":"discos/dhammapada.html",
"krishnaPrema":"discos/krishna-prema.html",
"rumiTodoAmor":"discos/rumi-todo-amor.html",
"versosDeLuz":"discos/versos-de-luz.html"
};
</script>
<div id="dharma-japa-root"></div>
<style>
  /* Carga de la fuente Bits Indian Calligra (Rajendra Bitling) */
  @font-face {
    font-family: 'BitsIndianCalligra';
    src: url('fonts/YatraOne-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  #dharma-japa-root {
    --jp-bg1: #241A34;
    --jp-bg2: #150F1E;
    --jp-cream: #F2E8D5;
    --jp-muted: #A78BFA;
    --jp-gold: #C084FC;
    --jp-violet: #C084FC;
    --jp-red: #C1432E;
    --jp-border: #4A3B5C;
    font-family: 'Karla', sans-serif;
    position: relative;
  }

  #dharma-japa-root * { box-sizing: border-box; }

  .jp-page {
    min-height: 100vh;
    width: 100%;
    background: radial-gradient(circle at 50% 30%, #050308 0%, #000000 55%, #000000 100%);
    color: var(--jp-cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 60px;
    border-radius: 0;
    position: relative;
    z-index: 0;
    overflow: hidden;
  }

  /* Imagen de la deidad elegida (260px) */
  .jp-top-deity-img {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 260px;
    height: 260px;
    object-fit: contain;
    z-index: 20;
    filter: drop-shadow(0 0 12px rgba(192, 132, 252, 0.4));
    pointer-events: none;
    transition: all 0.3s ease;
  }

  /* Ajuste para la imagen de Rama más grande */
  .jp-top-deity-img.jp-top-deity-img-rama {
    width: 330px;
    height: 330px;
    top: 5px;
    left: -15px;
  }

  /* iPad en vertical / pantallas estrechas: se deja hueco arriba en la
     pagina para que el titulo no quede debajo de la imagen de deidad.
     La imagen se mantiene grande (mismo tamano que en horizontal). */
  @media (max-width: 900px) {
    .jp-page {
      padding-top: 300px;
    }
  }

  /* Moviles estrechos (iPhone y similares): las pestanas de arriba se
     compactan para dejar mas hueco, y la imagen de deidad crece
     aprovechando ese hueco, sin llegar nunca a tocar las pestanas. */
  @media (max-width: 480px) {
    .jp-top-btn {
      font-size: 10.5px !important;
      padding: 6px 10px !important;
      letter-spacing: 0.02em;
    }
    .jp-top-btn .jp-ico { width: 12px; height: 12px; margin-right: 5px; }
    .jp-btn-tutorial {
      font-size: 9px !important;
      padding: 5px 8px !important;
      margin-top: 4px;
    }
    .jp-top-tabs {
      top: 10px;
      right: 10px;
      gap: 6px;
    }
    .jp-top-deity-img {
      width: clamp(140px, calc(100vw - 178px), 300px);
      height: clamp(140px, calc(100vw - 178px), 300px);
      top: 12px;
      left: 12px;
    }
    .jp-top-deity-img.jp-top-deity-img-rama {
      width: clamp(170px, calc(100vw - 160px), 380px);
      height: clamp(170px, calc(100vw - 160px), 380px);
      top: 8px;
      left: 6px;
    }
    .jp-page {
      padding-top: 300px;
    }
  }

  /* Logo inferior izquierdo con tamaño adaptado a botones */
  .jp-bottom-logo {
    position: absolute;
    bottom: 20px;
    left: 20px;
    height: 44px;
    width: auto;
    object-fit: contain;
    z-index: 20;
    filter: drop-shadow(0 0 6px rgba(192, 132, 252, 0.3));
    pointer-events: none;
  }

  .jp-cosmos-bg {
    position: absolute;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
  }

  .jp-nebula {
    position: absolute;
    inset: -25%;
    background:
      radial-gradient(circle at 22% 28%, rgba(192,132,252,0.14), transparent 55%),
      radial-gradient(circle at 78% 68%, rgba(192,132,252,0.12), transparent 58%),
      radial-gradient(circle at 50% 90%, rgba(193,67,46,0.08), transparent 60%);
    filter: blur(55px);
    animation: jp-nebula-pulse 26s ease-in-out infinite alternate;
  }

  @keyframes jp-nebula-pulse {
    from { transform: scale(1) translate(0, 0); opacity: 0.55; }
    to { transform: scale(1.18) translate(-3%, 2%); opacity: 0.8; }
  }

  .jp-star-layer {
    position: absolute;
    inset: -50%;
    background-repeat: repeat;
    transform-origin: 50% 50%;
    animation-name: jp-star-zoom;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .jp-star-layer-1 {
    background-image:
      radial-gradient(1.6px 1.6px at 20px 30px, rgba(255,255,255,1), transparent 60%),
      radial-gradient(1.2px 1.2px at 90px 60px, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(1.4px 1.4px at 150px 20px, rgba(255,255,255,1), transparent 60%),
      radial-gradient(1px 1px at 200px 120px, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1.3px 1.3px at 250px 180px, rgba(255,255,255,0.95), transparent 60%),
      radial-gradient(1px 1px at 60px 200px, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1.2px 1.2px at 190px 230px, rgba(255,255,255,0.85), transparent 60%),
      radial-gradient(1px 1px at 30px 130px, rgba(255,255,255,0.75), transparent 60%),
      radial-gradient(1.1px 1.1px at 230px 10px, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1.1px 1.1px at 110px 160px, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1px 1px at 270px 100px, rgba(255,255,255,0.65), transparent 60%),
      radial-gradient(1.2px 1.2px at 10px 90px, rgba(255,255,255,0.75), transparent 60%);
    background-size: 220px 220px;
    animation-duration: 18s;
    animation-delay: -6s;
  }

  .jp-star-layer-2 {
    background-image:
      radial-gradient(1px 1px at 40px 80px, rgba(192,132,252,0.95), transparent 60%),
      radial-gradient(1.3px 1.3px at 130px 40px, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1px 1px at 170px 160px, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1.2px 1.2px at 280px 90px, rgba(192,132,252,0.75), transparent 60%),
      radial-gradient(1px 1px at 100px 260px, rgba(255,255,255,0.65), transparent 60%),
      radial-gradient(1px 1px at 310px 220px, rgba(255,255,255,0.7), transparent 60%),
      radial-gradient(1.1px 1.1px at 200px 250px, rgba(255,255,255,0.65), transparent 60%),
      radial-gradient(1px 1px at 60px 30px, rgba(192,132,252,0.6), transparent 60%);
    background-size: 280px 280px;
    animation-duration: 24s;
    animation-delay: -14s;
  }

  .jp-star-layer-3 {
    background-image:
      radial-gradient(2px 2px at 60px 110px, rgba(255,255,255,1), transparent 60%),
      radial-gradient(1.6px 1.6px at 220px 60px, rgba(192,132,252,0.7), transparent 60%),
      radial-gradient(1.4px 1.4px at 320px 200px, rgba(255,255,255,0.9), transparent 60%),
      radial-gradient(1.6px 1.6px at 150px 320px, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(1.4px 1.4px at 40px 260px, rgba(255,255,255,0.75), transparent 60%);
    background-size: 340px 340px;
    animation-duration: 30s;
    animation-delay: -2s;
  }

  .jp-star-layer-4 {
    background-image:
      radial-gradient(2.6px 2.6px at 80px 60px, rgba(255,255,255,1), transparent 65%),
      radial-gradient(2.2px 2.2px at 260px 180px, rgba(255,255,255,0.95), transparent 65%),
      radial-gradient(2.4px 2.4px at 180px 320px, rgba(255,255,255,0.9), transparent 65%);
    background-size: 300px 300px;
    animation-duration: 12s;
    animation-delay: -9s;
  }

  @keyframes jp-star-zoom {
    0% { transform: scale(0.55); opacity: 0; }
    12% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .jp-star-layer, .jp-nebula { animation: none; opacity: 0.6; }
  }

  .jp-top-tabs {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: max-content;
    gap: 8px;
    z-index: 20;
  }

  .jp-top-btn {
    background: rgba(192, 132, 252, 0.1);
    border: 1px solid var(--jp-violet);
    color: var(--jp-violet);
    font-weight: 700;
    letter-spacing: 0.05em;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .jp-top-btn:hover {
    background: var(--jp-violet);
    color: var(--jp-bg2);
  }

  .jp-btn-audios, .jp-btn-deidad, .jp-btn-mala, .jp-btn-mantra {
    font-size: 13.5px;
    padding: 10px 18px;
  }

  .jp-btn-rituales {
    font-size: 13.5px;
    padding: 10px 18px;
  }
  .jp-top-btn .jp-ico { flex: none; margin-right: 8px; }
  /* Botones principales: icono y texto alineados a la izquierda, todos a la misma altura */
  .jp-btn-deidad, .jp-btn-mala, .jp-btn-mantra, .jp-btn-audios, .jp-btn-rituales {
    justify-content: flex-start;
    text-align: left;
  }
  .jp-btn-label { white-space: nowrap; }
  .jp-btn-caret {
    margin-left: auto;
    padding-left: 10px;
    font-size: 1.15em;
    line-height: 1;
  }
  /* Tutorial: es una ayuda, no una opcion de practica; mas discreto y separado */
  .jp-btn-tutorial {
    font-size: 11px;
    padding: 6px 12px;
    margin-top: 6px;
    align-self: flex-end;
    background: transparent;
    border-color: rgba(192, 132, 252, 0.45);
    font-weight: 600;
  }

  .jp-dropdown-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  .jp-dropdown-menu {
    overscroll-behavior: contain;
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 6px;
    background: #1C1328;
    border: 1px solid var(--jp-violet);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    overflow: hidden;
    width: 250px;
    display: flex;
    flex-direction: column;
    z-index: 30;
  }

  .jp-deidad-item {
    padding: 10px 16px;
    color: var(--jp-cream);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: background 0.2s ease;
  }

  .jp-deidad-item:last-child {
    border-bottom: none;
  }

  .jp-deidad-item:hover {
    background: rgba(192, 132, 252, 0.2);
    color: var(--jp-violet);
  }

  .jp-mala-info {
    float: right;
    padding: 0 4px 0 12px;
    color: var(--jp-violet);
    cursor: pointer;
  }
  .jp-mala-open .jp-mala-info { transform: rotate(180deg); }
  .jp-mala-open .jp-mala-desc { display: block; }
  .jp-mala-planeta {
    display: block;
    font-weight: 700;
    letter-spacing: 0.04em;
    margin-bottom: 3px;
    text-transform: uppercase;
    font-size: 11px;
  }
  .jp-mala-group-title {
    padding: 12px 16px;
    color: var(--jp-cream);
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(192, 132, 252, 0.08);
  }
  .jp-mala-group-title:hover { color: var(--jp-violet); }
  .jp-mala-group-arrow { float: right; color: var(--jp-violet); transition: transform 0.2s ease; }
  .jp-group-open .jp-mala-group-arrow { transform: rotate(180deg); }
  .jp-mala-group-list { display: none; }
  .jp-group-open .jp-mala-group-list { display: block; }
  .jp-mala-group-list .jp-deidad-item { padding-left: 24px; }
  .jp-deidad-malas-line {
    display: block;
    margin-top: 5px;
    font-size: 11.5px;
    color: var(--jp-cream);
    opacity: 0.85;
  }
  .jp-deidad-malas-line b { color: var(--jp-violet); letter-spacing: 0.03em; }
  .jp-planet-group { border-top: 2px solid rgba(192, 132, 252, 0.45); }
  .jp-planet-sym { color: var(--jp-violet); margin-right: 8px; font-size: 15px; }
  #jp-deidad-menu {
    max-height: 65vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #jp-mala-menu {
    max-height: 65vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .jp-mala-desc {
    display: none;
    margin-top: 5px;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;
    color: var(--jp-violet);
    white-space: normal;
  }
  .jp-deidad-malas {
    color: var(--jp-violet);
    font-weight: 700;
    margin-left: 16px;
  }

  .jp-mantra-menu {
    max-height: 380px;
    overflow-y: auto;
  }

  .jp-mantra-item {
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .jp-mantra-item:last-child {
    border-bottom: none;
  }

  .jp-mantra-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .jp-mantra-header:hover {
    background: rgba(192, 132, 252, 0.15);
  }

  .jp-mantra-name {
    color: var(--jp-cream);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .jp-mantra-arrow {
    color: var(--jp-violet);
    flex-shrink: 0;
    transition: transform 0.25s ease;
  }

  .jp-mantra-item.jp-mantra-open .jp-mantra-arrow {
    transform: rotate(180deg);
  }

  .jp-mantra-body {
    padding: 0 16px 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .jp-mantra-desc {
    margin: 0;
    color: var(--jp-muted);
    font-size: 12.5px;
    line-height: 1.55;
    flex: 1;
  }

  .jp-mantra-play {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid #C084FC !important;
    background: #C084FC !important;
    color: #3B0764 !important;
    box-shadow: none !important;
    text-shadow: none !important;
    background-image: none !important;
    font-size: 12px;
    font-weight: 700;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .jp-mantra-play:hover {
    background: var(--jp-violet);
    color: var(--jp-bg2);
  }

  .jp-audio-player {
    background: rgba(0, 0, 0, 0.3);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .jp-audio-player:last-child {
    border-bottom: none;
  }

  .jp-audio-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--jp-cream);
    font-weight: 600;
  }

  .jp-audio-controls-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .jp-audio-btn {
    background: var(--jp-violet);
    color: var(--jp-bg2);
    border: none;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .jp-audio-btn:hover {
    opacity: 0.9;
  }

  .jp-audio-btn-stop {
    background: var(--jp-red);
    color: var(--jp-cream);
  }

  .jp-audio-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--jp-gold);
    margin-left: auto;
  }

  .jp-volume-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    margin-top: 4px;
    font-size: 10px;
    color: var(--jp-muted);
  }

  .jp-volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.2);
    outline: none;
    cursor: pointer;
  }

  .jp-volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--jp-gold);
    cursor: pointer;
  }

  .jp-title-img {
    max-width: min(85vw, 320px);
    height: auto;
    margin: 0;
    display: block;
    filter: none;
  }

  .jp-subtitle { margin-top: 6px; max-width: 340px; text-align: center; color: var(--jp-muted); font-size: 15px; line-height: 1.5; }

  .jp-mode-switch, .jp-target-switch {
    margin-top: 16px;
    display: flex;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--jp-border);
    border-radius: 999px;
    padding: 4px;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }

  .jp-mode-btn {
    font-family: 'Karla', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--jp-muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  .jp-mode-btn.jp-mode-active {
    background: transparent;
    color: var(--jp-violet);
    border-color: var(--jp-border);
  }

  /* Práctica detenida o en pausa: la modalidad elegida se marca con perfil malva sólido */
  .jp-mode-switch:not(.jp-practice-on) .jp-mode-btn.jp-mode-active {
    border-color: var(--jp-violet);
  }

  .jp-target-btn-static {
    font-family: 'Karla', sans-serif;
    font-size: 13px;
    font-weight: 700;
    background: transparent;
    color: var(--jp-violet);
    border: 1px solid var(--jp-border);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: default;
  }

  .jp-rounds-control {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px 4px 14px;
    background: transparent;
    border-radius: 999px;
    border: 1px solid var(--jp-border);
  }

  .jp-rounds-label-text {
    font-size: 14px;
    font-weight: 700;
    color: var(--jp-violet);
  }

  .jp-rounds-num {
    font-size: 17px;
    font-weight: 800;
    color: #FFFFFF;
    margin-left: 2px;
    margin-right: 4px;
  }

  .jp-round-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--jp-border);
    background: transparent;
    color: var(--jp-cream);
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 0;
    line-height: 1;
  }

  .jp-round-btn:hover {
    background: rgba(192, 132, 252, 0.12);
    color: var(--jp-cream);
  }

  .jp-ring-wrap {
    position: relative;
    width: min(78vw, 320px);
    height: min(78vw, 320px);
    margin-top: 28px;
  }

  .jp-ring-wrap svg { width: 100%; height: 100%; }

  .jp-mala-ring-img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }

  .jp-ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }

  .jp-center-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .jp-center-icon::before,
  .jp-center-icon::after {
    content: '';
    position: absolute;
    width: 78%;
    height: 78%;
    border-radius: 50%;
    border: 2px solid rgba(192, 132, 252, 0.4);

  /* --- Botón "Cerrar" común a los modales (tutorial y reproductor de disco) --- */

  .jp-help-btn {

    padding: 10px 8px;

  function buildStoreGroupHTML(title, items, note) {
    var itemsHtml = items.map(function (it) {
      var imgClass = 'jp-store-img' + (it.square ? ' jp-store-img-square' : '') + (it.noFrame ? ' jp-store-img-noframe' : '');
      var amazonBadge = it.amazon ? '<img class="jp-store-amazon-icon" src="' + AMAZON_ICON + '" alt="Amazon" />' : '';
      var playerAttr = it.player ? ' data-player="' + it.player + '"' : '';
      var tag = it.player ? 'button type="button"' : 'a href="' + it.link + '" target="_blank" rel="noopener"';
      var tagClose = it.player ? 'button' : 'a';
      return (
        '<' + tag + ' class="jp-store-item"' + playerAttr + '>' +
          '<div class="jp-store-img-wrap' + (it.square ? ' jp-store-img-wrap-square' : '') + '">' +
            '<img class="' + imgClass + '" src="' + it.img + '" alt="' + it.name.replace(/"/g, '&quot;') + '" loading="lazy" />' +
          '</div>' +
          '<span class="jp-store-label">' + it.name + '</span>' + amazonBadge +
        '</' + tagClose + '>'
      );
    }).join('');
    return (
      '<div class="jp-store-group">' +
        '<h3 class="jp-store-title">' + title + (note ? '<span class="jp-store-title-note">' + note + '</span>' : '') + '</h3>' +
        '<div class="jp-store-carousel">' + itemsHtml + '</div>' +
      '</div>'
    );
  }

  document.querySelectorAll('#dharma-japa-root .jp-dropdown-menu').forEach(function(menu) {

      var blob = null, objUrl = null, closed = false;

      var canShareFiles = !!(navigator.canShare && window.File);
      if (!navigator.share) goBtn.textContent = 'Enviar por WhatsApp';

      function closeShare() {
        closed = true;
        document.removeEventListener('keydown', onKey);
        document.body.style.overflow = prevOverflow;
        if (objUrl) URL.revokeObjectURL(objUrl);
        overlay.remove();
      }
      function onKey(e) { if (e.key === 'Escape') closeShare(); }

      buildCard().then(canvasToBlob).then(function (b) {
        if (closed) return;
        if (!b) {
          preview.textContent = 'No se pudo preparar la imagen. Aun así puedes compartir el enlace.';
          goBtn.disabled = false;
          return;
        }
        blob = b;
        objUrl = URL.createObjectURL(b);
        preview.innerHTML = '';
        var im = document.createElement('img');
        im.src = objUrl;
        im.alt = 'Imagen para compartir Japa-Móvil';
        preview.appendChild(im);
        goBtn.disabled = false;
        dlBtn.disabled = false;
      });

      goBtn.addEventListener('click', function () {
        var text = SHARE_TEXT + ' ' + SHARE_URL;
        if (navigator.share) {
          if (blob && canShareFiles) {
            var file = new File([blob], 'Japa-Movil.jpg', { type: 'image/jpeg' });
            var data = { files: [file], title: 'Japa-Móvil', text: text };
            if (navigator.canShare(data)) {
              navigator.share(data).catch(function () {});
              return;
            }
          }
          navigator.share({ title: 'Japa-Móvil', text: SHARE_TEXT, url: SHARE_URL }).catch(function () {});
        } else {
          window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
        }
      });

      dlBtn.addEventListener('click', function () {
        if (!objUrl) return;
        var a = document.createElement('a');
        a.href = objUrl;
        a.download = 'Japa-Movil.jpg';
        document.body.appendChild(a);
        a.click();
        a.remove();
      });

      copyBtn.addEventListener('click', function () {
        function done(ok) {
          var old = 'Copiar enlace';
          copyBtn.textContent = ok ? '¡Enlace copiado!' : 'No se pudo copiar';
          setTimeout(function () { if (!closed) copyBtn.textContent = old; }, 2200);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(SHARE_URL).then(function () { done(true); }, function () { done(false); });
        } else {
          var ta = document.createElement('textarea');
          ta.value = SHARE_URL;
          ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) {}
          ta.remove();
          done(ok);
        }
      });

      closeBtn.addEventListener('click', closeShare);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeShare(); });
      document.addEventListener('keydown', onKey);
      closeBtn.focus();

  function setMalaBead(val) {
    /* val = 0 -> imagen 00 (reposo). val = 1,2,3... -> cuenta 1,2,3...
       recorriendo las cuentas reales de la mala activa; al llegar a
       MALA_BEADS+1 vuelve a mostrarse la 01, y asi sucesivamente. */
    if (!MALA_IMG_BASE) return;
    var beadIdx;
    if (val <= 0) {

    } else {
      beadIdx = ((val - 1) % MALA_BEADS) + 1;

  btnStart.addEventListener('click', function () {
    elError.classList.add('jp-hidden');
    var constraints = { audio: { echoCancellation: true, noiseSuppression: true } };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      elError.textContent = 'Tu navegador no permite el acceso al micr\u00f3fono.';
      elError.classList.remove('jp-hidden');
      return;
    }
    navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
      micStream = stream;
      var AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var source = audioCtx.createMediaStreamSource(stream);
      var analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      source.connect(analyser);
      var dataArray = new Uint8Array(analyser.frequencyBinCount);
      isListening = true;
      updateModeHighlight();
      btnStart.classList.add('jp-hidden');
      speechMsg.classList.add('jp-hidden');
      speechActionRow.classList.remove('jp-hidden');
      elIcon.classList.add('jp-hidden');
      elCount.classList.remove('jp-hidden');
      elVu.classList.remove('jp-hidden');
      processAudioFn = function() {
        if (!isListening) return;
        analyser.getByteFrequencyData(dataArray);
        var sum = 0;
        for (var i = 0; i < dataArray.length; i++) sum += dataArray[i];
        var average = sum / dataArray.length;
        var pct = Math.min(100, Math.round((average / 80) * 100));
        elBar.style.width = pct + '%';
        var now = Date.now();
        if (average > 25 && (now - lastDetectionTime > 1400)) {
          lastDetectionTime = now;
          count++;
          updateCounterUI();
        }
        requestAnimationFrame(processAudioFn);
      };
      processAudioFn();
    }).catch(function () {
      elError.textContent = 'Error al activar el micr\u00f3fono.';
      elError.classList.remove('jp-hidden');
    });
  });

      }
      function onKey(e) { if (e.key === 'Escape') closeInstall(); }
      body.addEventListener('click', function (e) {
        var osBtn = e.target.closest('[data-os]');
        if (osBtn) showInstall(osBtn.getAttribute('data-os'));
      });
      overlay.querySelector('#jp-install-close').addEventListener('click', closeInstall);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeInstall(); });
      document.addEventListener('keydown', onKey);
      showInstall(detectOS());
      overlay.querySelector('#jp-install-close').focus();
    });
  })();

  /* Aviso de desbloqueo (con mini reproductor para los fondos) */
  function openUpgrade(kind, key, label) {
    var cfg = UPGRADE_TEXTS[kind] || UPGRADE_TEXTS.deidad;
    var overlay = document.createElement('div');
    overlay.className = 'jp-upgrade-modal';
    overlay.setAttribute('role', 'dialog');
    overlay.setAttribute('aria-modal', 'true');
    var preview = '';
    if (kind === 'fondo' && key) {
      preview =
        '<div class="jp-upgrade-preview">' +
          '<div class="jp-upgrade-video-box">' +
            '<video class="jp-upgrade-video" muted loop playsinline preload="auto" ' +
              'poster="' + FREE.previewDir + key + '.jpg" src="' + FREE.previewDir + key + '.mp4"></video>' +
            '<button type="button" class="jp-upgrade-playbtn" aria-label="Reproducir o pausar la vista previa"></button>' +
          '</div>' +
          '<p class="jp-upgrade-preview-label">Vista previa &middot; ' + (label || '') + '</p>' +
        '</div>';
    }
    overlay.innerHTML =
      '<div class="jp-upgrade-modal-content">' +
        '<button type="button" class="jp-modal-close" id="jp-upgrade-close" aria-label="Cerrar"><span class="jp-modal-close-x">&times;</span> Cerrar</button>' +
        '<p class="jp-upgrade-icon">&#128274;</p>' +
        '<h3 class="jp-upgrade-title">' + cfg.title + '</h3>' +
        '<p class="jp-upgrade-text">' + cfg.text + '</p>' +
        preview +
        '<a class="jp-upgrade-btn" id="jp-upgrade-buy" href="' + FREE.upgradeUrl + '" target="_blank" rel="noopener">Adquirir la versi&oacute;n Premium</a>' +
        '<button type="button" class="jp-upgrade-later" id="jp-upgrade-later">Seguir con la versi&oacute;n gratuita</button>' +
      '</div>';
    document.body.appendChild(overlay);

    var vid = overlay.querySelector('.jp-upgrade-video');
    var box = overlay.querySelector('.jp-upgrade-video-box');
    function syncPlayState() {
      if (box) box.classList.toggle('jp-upgrade-paused', !vid || vid.paused);
    }
    if (vid) {
      vid.addEventListener('play', syncPlayState);
      vid.addEventListener('pause', syncPlayState);
      syncPlayState();
      var pr = vid.play();            /* dentro del toque del usuario: el móvil permite reproducir (sin sonido) */
      if (pr && pr.catch) pr.catch(function () { syncPlayState(); });
      overlay.querySelector('.jp-upgrade-playbtn').addEventListener('click', function () {
        if (vid.paused) { var p2 = vid.play(); if (p2 && p2.catch) p2.catch(function () {}); }
        else { vid.pause(); }
      });
    }

    function closeUpgrade() {
      if (vid) { try { vid.pause(); } catch (err) {} }
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    }
    function onKey(e) { if (e.key === 'Escape') closeUpgrade(); }
    document.addEventListener('keydown', onKey);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeUpgrade(); });
    overlay.querySelector('#jp-upgrade-close').addEventListener('click', closeUpgrade);
    overlay.querySelector('#jp-upgrade-later').addEventListener('click', closeUpgrade);
  }

  /* Intercepta cualquier toque sobre algo bloqueado (fase de captura: va antes que los manejadores de la app).
     Las flechitas y descripciones de deidades/malas siguen funcionando para poder leerlas. */
  root.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var hit = t.closest('[data-locked]');
    if (!hit || !root.contains(hit)) return;
    if (t.closest('.jp-mala-info') || t.closest('.jp-mala-desc')) return;
    e.preventDefault();
    e.stopPropagation();
    var menu = hit.closest('.jp-dropdown-menu');
    if (menu) menu.classList.add('jp-hidden');
    var kind = hit.getAttribute('data-locked');
    var key = hit.getAttribute('data-lock-key');
    var label = '';
    if (kind === 'fondo') label = (hit.textContent || '').replace(/\s+/g, ' ').trim();
    openUpgrade(kind, key, label);
  }, true);
  } // fin de initJapaApp

  /* --- Arranque (versión gratuita: sin licencia) --- */
  initJapaApp();
})();
</script>
